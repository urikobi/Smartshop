
name: check-stores

# Manual run only. No schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check store files
        run: python scripts/check_stores.py

      - name: Upload report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stores-report
          path: stores_report/
          if-no-files-found: warn
          
